const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function ouvrir(code) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(D.s), iterations: D.n, hash: 'SHA-256' },
                                            base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const html = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(D.i) }, key, bytes(D.c));
  document.open(); document.write(new TextDecoder().decode(html)); document.close();
}
const f = document.getElementById('f'), msg = document.getElementById('msg');
f.addEventListener('submit', async e => {
  e.preventDefault();
  const code = document.getElementById('code').value.trim();
  msg.textContent = 'Ouverture...';
  try {
    if (document.getElementById('keep').checked) { try { localStorage.setItem('tresor_code', code); } catch (x) {} }
    await ouvrir(code);
  } catch (x) {
    try { localStorage.removeItem('tresor_code'); } catch (y) {}
    msg.textContent = 'Code incorrect.';
  }
});
let mem = null;
try { mem = localStorage.getItem('tresor_code'); } catch (x) {}
if (mem) ouvrir(mem).catch(() => { try { localStorage.removeItem('tresor_code'); } catch (x) {} });
